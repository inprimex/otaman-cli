name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Force Node 24 runtime now (deprecated Node 20 removed Sep 16 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ce-lint-standard: ruff pinned exactly (F182 doctrine — unpinned CI
      # tooling is drift waiting to break builds). Bump via ordinary PR.
      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout otaman-cli
        uses: actions/checkout@v7
        with:
          path: workspace/otaman-cli

      - name: Checkout otaman-core (sibling path-dep)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-core
          path: workspace/otaman-core

      - name: Checkout otaman-bridge (sibling path-dep)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-bridge
          path: workspace/otaman-bridge

      - name: Checkout otaman-plugin (sibling path-dep)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-plugin
          path: workspace/otaman-plugin

      - name: Checkout otaman-adapters (sibling path-dep)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-adapters
          path: workspace/otaman-adapters

      - name: Generate workspace pyproject.toml
        shell: bash
        working-directory: workspace
        run: |
          cat > pyproject.toml <<'EOF'
          [project]
          name = "otaman-ci-workspace"
          version = "0.0.0"
          description = "Ephemeral workspace pyproject used by CI to wire up sibling path-deps"
          requires-python = ">=3.10"

          [tool.uv.workspace]
          members = ["otaman-core","otaman-bridge","otaman-plugin","otaman-adapters","otaman-cli"]

          [tool.uv.sources]
          otaman-core = { workspace = true }
          otaman-bridge = { workspace = true }
          otaman-plugin = { workspace = true }
          otaman-adapters = { workspace = true }
          otaman-cli = { workspace = true }
          EOF
          echo "Workspace pyproject written:"
          cat pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "workspace/otaman-cli/pyproject.toml"

      - name: Install dependencies
        working-directory: workspace/otaman-cli
        run: uv sync --extra test --no-dev

      - name: Run tests
        working-directory: workspace/otaman-cli
        run: uv run pytest tests/ -v

      - name: Audit maestro references (Linux/macOS only)
        if: runner.os != 'Windows'
        working-directory: workspace/otaman-cli
        run: bash ../otaman-core/scripts/audit-maestro-refs.sh src/

  # Branch-protection anchor (fleet ci-ok standard, spec-agent
  # 20260818T202435; shape mirrors otaman-plugin's reference). The OS
  # matrix legs are brittle to require individually; require `ci-ok`
  # instead. `if: always()` + the explicit result gate means a failed or
  # skipped dependency makes ci-ok FAIL (not skip) — a skipped required
  # check would otherwise let a broken PR through.
  ci-ok:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs passed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::A required job did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
