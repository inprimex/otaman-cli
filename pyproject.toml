[project]
name = "otaman-cli"
# This is the dev-source floor. otaman-deploy's release.yml STAMPS this to the
# product release tag at build time, so the product version is authoritative
# for tenant installs (a wheel may read a higher version than this line). Bump
# it when it lags a shipped product release; do not expect it to match tenants.
version = "0.5.0"
description = "Otaman standalone CLI: subcommand dispatch, local + remote operations, account management"
# 3.11, not 3.10: otaman-core is a hard dependency below and declares
# `requires-python = ">=3.11"`, so a 3.10 install could never resolve — the old
# ">=3.10" was a floor nothing could stand on, and it cost a real workaround
# (cli #234 normalized fractional seconds to six digits for 3.10's stricter
# `fromisoformat`, protecting an interpreter this package cannot run on).
# A test asserts this stays at or above every declared dependency's floor.
requires-python = ">=3.11"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "otaman-core",
    "otaman-adapters",
    "otaman-bridge",
    "otaman-plugin",
    "pyyaml>=6",
    "questionary>=2.0",
    "ruamel.yaml>=0.18",
    "pydantic>=2",
    "jinja2>=3",
]

[project.optional-dependencies]
# `test` pulls in [console] so CI (`uv sync --extra test`) exercises the
# interactive console on every run — the house-rule requirement that the
# pinned Textual version is tested everywhere.
test = ["pytest>=7", "otaman-cli[console]"]
# Optional terminal-QR rendering for `otaman hitl enroll totp`. TOTP itself
# is dep-free (stdlib hmac/hashlib); segno is only needed to draw a scannable
# QR — the otpauth URI is always printed regardless, so QR is never a base dep.
totp-qr = ["segno>=1.5"]
# Interactive human console (`otaman -i`, interactive-human-console). Textual
# is EXACT-PINNED per the house rule (a TUI framework's rendering + key-binding
# behavior is version-sensitive; a floating range would drift the UX and tests).
# BUMP PROCEDURE: change the pin here only, run the full suite (the console
# tests drive Textual's App.run_test() pilot), eyeball `otaman -i` manually,
# then commit the bump as its own PR. Console is an EXTRA (not a base dep) so a
# plain `pip install otaman-cli` stays light; `otaman -i` prints an install
# hint when it is absent.
console = ["textual==8.2.8"]

# Entry point: `otaman` script — created by pip/uv on install. After
# `pip install otaman-cli` the user gets `otaman` on PATH directly;
# no wrapper script needed.
[project.scripts]
otaman = "otaman_cli.main:main"
maestro = "otaman_cli.main:main"  # legacy alias during transition

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_cli"]

# ce-lint-standard baseline — rule floor, MAY add categories, MUST NOT remove.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Until uv workspace + editable install lands (Stage 1E), tests find
# otaman-core via a sibling-checkout path. Workspace setup will replace this.
pythonpath = ["src", "../otaman-core/src", "../otaman-bridge/src", "../otaman-plugin/src"]
