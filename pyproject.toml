[project]
name = "otaman-cli"
version = "0.4.0"
description = "Otaman standalone CLI: subcommand dispatch, local + remote operations, account management"
requires-python = ">=3.10"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "otaman-core",
    "otaman-adapters",
    "otaman-bridge",
    "otaman-plugin",
    "pyyaml>=6",
    "questionary>=2.0",
    "ruamel.yaml>=0.18",
    "pydantic>=2",
    "jinja2>=3",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Optional terminal-QR rendering for `otaman hitl enroll totp`. TOTP itself
# is dep-free (stdlib hmac/hashlib); segno is only needed to draw a scannable
# QR — the otpauth URI is always printed regardless, so QR is never a base dep.
totp-qr = ["segno>=1.5"]

# Entry point: `otaman` script — created by pip/uv on install. After
# `pip install otaman-cli` the user gets `otaman` on PATH directly;
# no wrapper script needed.
[project.scripts]
otaman = "otaman_cli.main:main"
maestro = "otaman_cli.main:main"  # legacy alias during transition

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_cli"]

# ce-lint-standard baseline — rule floor, MAY add categories, MUST NOT remove.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Until uv workspace + editable install lands (Stage 1E), tests find
# otaman-core via a sibling-checkout path. Workspace setup will replace this.
pythonpath = ["src", "../otaman-core/src", "../otaman-bridge/src", "../otaman-plugin/src"]
