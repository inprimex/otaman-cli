[project]
name = "otaman-cli"
version = "0.1.0"
description = "Otaman standalone CLI: subcommand dispatch, local + remote operations, account management"
requires-python = ">=3.10"
authors = [{ name = "Otaman platform" }]
license = { text = "UNLICENSED" }
dependencies = [
    "otaman-core",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

# Entry point: `otaman` script. Body lands when the dispatcher migrates
# in Stage 2J. Today this is a stub package with one extracted function.
# [project.scripts]
# otaman = "otaman_cli.main:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Until uv workspace + editable install lands (Stage 1E), tests find
# otaman-core via a sibling-checkout path. Workspace setup will replace this.
pythonpath = ["src", "../otaman-core/src"]
